sonar.projectKey=Luis-Morenoo_vaultkeep
sonar.organization=luis-morenoo
sonar.host.url=https://sonarcloud.io

sonar.sources=vaultkeep
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# attacks/ holds deliberate attack simulations (path inputs, weak comparisons) and
# isn't in sonar.sources; listed here too so it's never analysed as product code
sonar.exclusions=attacks/**
# Coverage is measured for the Python code (pytest + coverage.py). The browser JS has
# no unit tests yet, so it's left out of the coverage figure only; Sonar still
# analyses it for bugs and security issues. See "Known limitations" in the README.
sonar.coverage.exclusions=vaultkeep/web/static/**
