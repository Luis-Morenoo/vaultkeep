<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>VaultKeep Login</title>
        <!-- Script lives in /static so the Content-Security-Policy can forbid inline code -->
        <script src="{{ url_for('static', filename='login.js') }}" defer></script>
    </head>
    <body>
        <form id="login-form">
            <label for="password">Master password</label>
            <input type="password" id="password" placeholder="Master Password" autocomplete="current-password" required>
            <button type="submit">Unlock Vault</button>
        </form>
        <p id="error-message"></p>
    </body>
</html>
