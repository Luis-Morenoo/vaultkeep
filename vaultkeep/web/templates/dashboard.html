<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>VaultKeep Dashboard</title>
        <!-- Script lives in /static so the Content-Security-Policy can forbid inline code -->
        <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
    </head>
    <body>
        <h1>VaultKeep</h1>

        <!-- master password: needed to decrypt for list, add and delete -->
        <label for="master-password">Master password</label>
        <input type="password" id="master-password" placeholder="Master password" autocomplete="current-password" required>
        <button id="show-btn">Show entries</button>
        <button id="logout-btn">Logout</button>

        <ul id="entries-list"></ul>
        <p id="error-message"></p>

        <h3>Add entry</h3>
        <form id="add-form">
            <label for="service">Service</label>
            <input type="text" id="service" placeholder="Service" required>
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Username" required>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" autocomplete="new-password" required>
            <button type="submit">Add Entry</button>
        </form>
    </body>
</html>
