services:
  vaultkeep:
    build: .
    container_name: vaultkeep
    ports:
      # Bound to localhost only: the UI is plain HTTP and must not be reachable from the LAN
      - "127.0.0.1:5000:5000"
    env_file: .env
    volumes:
      - vaultkeep-data:/home/vaultkeep/.vaultkeep
    read_only: true          # container file system is immutable; only the volume and /tmp are writable
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  vaultkeep-data:
    name: vaultkeep-data
