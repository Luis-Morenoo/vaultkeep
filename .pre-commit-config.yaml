# Runs before every commit. Setup once:  pip install pre-commit && pre-commit install
# Refresh hook versions later with:  pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # block commits that contain secrets

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-r", "vaultkeep", "run.py"]
        pass_filenames: false

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.0
    hooks:
      - id: black